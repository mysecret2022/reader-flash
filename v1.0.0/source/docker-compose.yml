services:
  reader-flash:
    image: ghcr.io/mysecret2022/reader-flash:latest
    container_name: reader-flash
    restart: always
    ports:
      - "8090:8080" # 宿主机访问端口 http://localhost:8090
    volumes:
      - ./storage:/storage # 数据持久化目录（书源、书架、用户数据、缓存及配置）
      - ./logs:/app/logs   # 运行日志
    environment:
      - TZ=Asia/Shanghai
      - SPRING_PROFILES_ACTIVE=prod
      - JAVA_OPTS=-Xmx512m
      - READER_APP_SECURE=true # 多用户模式（管理员：admin / admin）
