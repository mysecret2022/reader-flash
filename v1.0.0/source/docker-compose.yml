services:
  reader-flash:
    build: .
    image: reader-flash:latest
    container_name: reader-flash
    restart: always
    ports:
      - "8090:8080" # 外部访问端口，按需调整（宿主机端口:容器端口）
    volumes:
      - ./storage:/storage # 数据持久化目录（书源、书架、用户数据、缓存及配置）
      - ./logs:/app/logs   # 日志输出目录（与管理后台诊断日志实时互通）
    environment:
      - TZ=Asia/Shanghai
      - SPRING_PROFILES_ACTIVE=prod
      - READER_APP_SECURE=true # 默认多用户鉴权模式（默认管理员：admin，默认密码：admin）
